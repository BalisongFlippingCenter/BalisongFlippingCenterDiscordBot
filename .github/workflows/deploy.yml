name: Deploy bot to production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: for f in index.js deploy-commands.js $(find src -name '*.js'); do node --check "$f"; done

      - name: Load every command definition
        run: node -e "for (const f of require('fs').readdirSync('src/commands')) require('./src/commands/' + f).data.toJSON()"

      - name: Unit tests
        run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BOT_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$REPOSITORY:$GITHUB_SHA" -t "$REPOSITORY:latest" .
          docker push "$REPOSITORY:$GITHUB_SHA"
          docker push "$REPOSITORY:latest"

      - name: Deploy to the backend instance
        env:
          IMAGE: ${{ vars.AWS_ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=balisong-prod-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$(echo "$INSTANCE_ID" | wc -w)" -ne 1 ]; then
            echo "Expected exactly one running balisong-prod-server instance, found: '$INSTANCE_ID'"
            exit 1
          fi

          SCRIPT=$(base64 -w0 deploy/remote-deploy.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Discord bot $GITHUB_SHA" \
            --parameters "commands=[\"echo $SCRIPT | base64 -d > /tmp/discord-bot-deploy.sh\",\"bash /tmp/discord-bot-deploy.sh $IMAGE\"]" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = Success ]
